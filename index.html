<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caça ao Som - Jogo Auditivo</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Caça ao Som</h1>

    <p>
      Jogo auditivo acessível. Encontre o alvo usando apenas os sons.
    </p>

    <button id="start">Começar jogo</button>
    <button id="repeat" disabled>Repetir instruções</button>

    <p id="status" role="status" aria-live="polite">
      Pressione "Começar jogo".
    </p>

    <p id="timer">Tempo: 60</p>

    <div id="game" aria-hidden="true"></div>
  </main>

  <script src="game.js"></script>
</body>
</html>
